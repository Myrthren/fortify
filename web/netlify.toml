[build]
  # This project intentionally uses Prisma db push rather than migrations.
  # Without syncing first, generated clients can reference columns that the
  # production database does not have yet.
  command = "npx prisma db push && npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
