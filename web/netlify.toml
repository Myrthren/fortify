[build]
  # Apply only reviewed, additive production changes. A broad `prisma db push`
  # would try to remove legacy tables that are intentionally kept live.
  command = "npx prisma db execute --file prisma/deploy-safe.sql --url $DIRECT_URL && npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
