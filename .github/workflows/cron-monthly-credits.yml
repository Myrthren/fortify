name: Monthly Credits (1st of month)

on:
  schedule:
    - cron: "0 0 1 * *"   # midnight UTC on the 1st of every month
  workflow_dispatch:        # lets you trigger it manually from GitHub Actions tab

jobs:
  monthly-credits:
    runs-on: ubuntu-latest
    steps:
      - name: Call monthly-credits endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/monthly-credits" \
          | grep -qE "^2" && echo "✅ monthly-credits OK" || (echo "❌ monthly-credits failed" && exit 1)
